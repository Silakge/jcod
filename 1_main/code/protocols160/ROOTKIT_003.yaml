  params: {}
ambiguity_rules:
- Tool installation path → Limited to ./target
- DNS query content → Does not participate in matching (based on the number of network
  attempts)
sandbox_setup:
  seed_files: 1
  seed_file_content: predictable content for hash
  test_dir: ./target
  timeout_seconds: 30
  network: disabled
attck_mapping:
- T1105
- T1071.004
- T1543
behavior_category: network
